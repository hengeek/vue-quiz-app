when:
  event: manual

steps:
  - name: build-and-package
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/node:20-alpine
    commands:
      - npm ci
      - VITE_APP_USE_LOCALDATA=true npm run build
      - mkdir -p "/root/Packages/vue-quiz-app/${CI_COMMIT_SHA}"; tar -czf "/root/Packages/vue-quiz-app/${CI_COMMIT_SHA}/dist.tar.gz" -C dist .; sha256sum "/root/Packages/vue-quiz-app/${CI_COMMIT_SHA}/dist.tar.gz" > "/root/Packages/vue-quiz-app/${CI_COMMIT_SHA}/dist.tar.gz.sha256"; printf '{"app":"vue-quiz-app","commit":"%s","artifact":"dist.tar.gz"}' "${CI_COMMIT_SHA}" > "/root/Packages/vue-quiz-app/${CI_COMMIT_SHA}/artifact-manifest.json"
